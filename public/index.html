<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SIM Kart Takip Sistemi</title>
    <link rel="stylesheet" href="/css/style.css" />
  </head>
  <body>
    <!-- Toast Container -->
    <div id="toast-container"></div>

    <!-- Confirm Modal -->
    <div class="modal-overlay" id="confirmModal">
      <div class="modal confirm-modal">
        <div class="modal-body">
          <div class="confirm-icon" id="confirmIcon">⚠️</div>
          <div
            class="card-title confirm-title-center"
            id="confirmTitle"
            data-i18n="confirm_title"
          >
            Emin misiniz?
          </div>
          <p class="confirm-text" id="confirmText"></p>
        </div>
        <div class="modal-footer">
          <button class="btn btn-secondary" id="confirmCancel" data-i18n="confirm_cancel">İptal</button>
          <button class="btn btn-danger" id="confirmOk" data-i18n="delete">Sil</button>
        </div>
      </div>
    </div>

    <!-- App Layout -->
    <div class="app-layout app-layout-hidden" id="appLayout">
      <!-- Sidebar -->
      <nav class="sidebar">
        <div class="sidebar-logo">
          <div class="logo-title logo-title-nowrap">📡 SIM Takip</div>
        </div>

        <div class="nav-section" data-i18n="nav_lines">Hatlar</div>
        <a class="nav-item" data-page="m2m" href="#">
          <svg
            width="16"
            height="16"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
          >
            <rect x="2" y="7" width="20" height="14" rx="2" />
            <path d="M16 3H8l-2 4h12l-2-4z" />
          </svg>
          <span data-i18n="nav_m2m">M2M Hatları</span>
        </a>
        <a class="nav-item" data-page="data" href="#">
          <svg
            width="16"
            height="16"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
          >
            <path d="M22 12h-4l-3 9L9 3l-3 9H2" />
          </svg>
          <span data-i18n="nav_data">Data Hatları</span>
        </a>
        <a class="nav-item" data-page="voice" href="#">
          <svg
            width="16"
            height="16"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
          >
            <path
              d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07A19.5 19.5 0 0 1 4.69 12 19.79 19.79 0 0 1 1.61 3.44 2 2 0 0 1 3.59 1h3.18A2 2 0 0 1 8.72 2.8a12.37 12.37 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L7.91 8.8a16 16 0 0 0 6.29 6.29l1.08-1.06a2 2 0 0 1 2.11-.45 12.37 12.37 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"
            />
          </svg>
          <span data-i18n="nav_voice">Ses Hatları</span>
        </a>

        <div class="nav-section" data-i18n="nav_analysis">Analiz</div>
        <a class="nav-item" data-page="reports" href="#">
          <svg
            width="16"
            height="16"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
          >
            <line x1="18" y1="3" x2="18" y2="21" />
            <line x1="12" y1="8" x2="12" y2="21" />
            <line x1="6" y1="14" x2="6" y2="21" />
            <line x1="2" y1="21" x2="22" y2="21" />
          </svg>
          <span data-i18n="nav_reports">Raporlar</span>
        </a>

        <div class="nav-section" data-i18n="nav_system">Sistem</div>
        <a class="nav-item" data-page="settings" href="#" id="settingsNav">
          <svg
            width="16"
            height="16"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
          >
            <circle cx="12" cy="12" r="3" />
            <path
              d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"
            />
          </svg>
          <span data-i18n="nav_settings">Ayarlar</span>
        </a>
        <a class="nav-item admin-only" data-page="logs" href="#" id="logsNav">
          <svg
            width="16"
            height="16"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
          >
            <path
              d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"
            />
            <polyline points="14 2 14 8 20 8" />
            <line x1="16" y1="13" x2="8" y2="13" />
            <line x1="16" y1="17" x2="8" y2="17" />
            <polyline points="10 9 9 9 8 9" />
          </svg>
          <span data-i18n="nav_logs">İşlem Geçmişi</span>
        </a>
      </nav>

      <!-- Main -->
      <div class="main-content">
        <header class="topbar">
          <div class="topbar-left" id="topbarActions">
            <!-- Dynamic buttons like Excel Export will be here -->
          </div>
          <div class="topbar-center">
            <h2 class="topbar-title" id="pageTitle">—</h2>
          </div>
          <div class="topbar-right-wrapper">

            
            <div class="user-card" id="userCard">
              <div class="user-avatar" id="userAvatar">?</div>
              <div class="user-info">
                <div class="user-name" id="userName">...</div>
                <div class="user-role" id="userRole">—</div>
              </div>
            </div>

            <button class="btn-icon-label" id="logoutBtn" data-i18n="logout" data-i18n-title="logout">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
                <span data-i18n="logout">Çıkış</span>
            </button>

            <div class="theme-toggle" id="themeToggle" title="Tema Değiştir">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" id="themeIcon">
                <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
              </svg>
            </div>
          </div>
        </header>
        <div class="page-content" id="pageContent">
          <div class="loading-overlay"><div class="spinner"></div></div>
        </div>
      </div>
    </div>

    <script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
    <script src="/js/i18n.js"></script>
    <script src="/js/api.js"></script>
    <script src="/js/ui.js"></script>
    <script src="/js/bulk-import.js"></script>
    <script src="/js/pages/m2m.js"></script>
    <script src="/js/pages/data.js"></script>
    <script src="/js/pages/voice.js"></script>
    <script src="/js/pages/reports.js"></script>
    <script src="/js/pages/settings.js"></script>
    <script src="/js/pages/logs.js"></script>
    <script src="/js/app.js"></script>
    <!-- Timeline Modal -->
    <div class="modal-overlay" id="timelineModal">
      <div class="modal" style="max-width: 600px">
        <div class="modal-header">
          <span class="modal-title" data-i18n="timeline_title">SIM Kart Geçmişi</span>
          <button class="modal-close" onclick="UI.closeModal('timelineModal')">
            ×
          </button>
        </div>
        <div class="modal-body">
          <div id="timelineContent" class="timeline">
            <!-- Timeline items will be loaded here -->
          </div>
        </div>
        <div class="modal-footer">
          <button
            class="btn btn-secondary"
            onclick="UI.closeModal('timelineModal')"
            data-i18n="close"
          >
            Kapat
          </button>
        </div>
      </div>
    </div>
  </body>
</html>
